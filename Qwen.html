<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PyCamp — Полный курс Python</title>
<script src="https://cdn.jsdelivr.net/pyodide/v0.25.1/full/pyodide.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0a0a23;
    --bg-2: #1b1b32;
    --bg-3: #2a2a45;
    --text: #dfdfe2;
    --text-dim: #a0a0b0;
    --accent: #f1be32;
    --green: #acd157;
    --red: #e74c3c;
    --blue: #3b82f6;
    --border: #3d3d5c;
  }
  body {
    font-family: 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  header {
    background: var(--bg-2);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 20px;
    font-weight: bold;
    color: var(--accent);
  }
  .logo-icon {
    width: 36px; height: 36px;
    background: var(--accent);
    color: var(--bg);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    font-size: 20px;
  }
  .progress-wrap {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 14px;
  }
  .progress-bar {
    width: 200px;
    height: 8px;
    background: var(--bg-3);
    border-radius: 4px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--green));
    transition: width 0.4s;
  }
  main {
    flex: 1;
    display: flex;
    overflow: hidden;
  }
  aside {
    width: 280px;
    background: var(--bg-2);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    flex-shrink: 0;
  }
  .section-title {
    padding: 14px 16px;
    font-size: 12px;
    text-transform: uppercase;
    color: var(--text-dim);
    letter-spacing: 1px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-3);
    position: sticky;
    top: 0;
  }
  .lesson-item {
    padding: 10px 16px;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    transition: background 0.2s;
  }
  .lesson-item:hover { background: var(--bg-3); }
  .lesson-item.active {
    background: var(--bg-3);
    border-left: 3px solid var(--accent);
    padding-left: 13px;
  }
  .lesson-item.done .check { color: var(--green); }
  .check {
    width: 16px;
    height: 16px;
    border: 2px solid var(--border);
    border-radius: 3px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    flex-shrink: 0;
  }
  .lesson-item.done .check {
    border-color: var(--green);
    background: var(--green);
    color: var(--bg);
  }
  .content {
    flex: 1;
    display: flex;
    overflow: hidden;
  }
  .lesson-area {
    flex: 1;
    overflow-y: auto;
    padding: 32px 48px;
    max-width: 780px;
  }
  .lesson-area h1 {
    color: var(--accent);
    margin-bottom: 8px;
    font-size: 28px;
  }
  .lesson-area h2 {
    color: var(--green);
    margin: 24px 0 12px;
    font-size: 20px;
  }
  .lesson-area p, .lesson-area li {
    line-height: 1.7;
    margin-bottom: 12px;
    color: var(--text);
  }
  .lesson-area ul, .lesson-area ol { margin-left: 24px; margin-bottom: 16px; }
  .lesson-area code {
    background: var(--bg-3);
    padding: 2px 6px;
    border-radius: 3px;
    font-family: 'Consolas', monospace;
    color: var(--accent);
    font-size: 0.95em;
  }
  .lesson-area pre {
    background: var(--bg-2);
    border: 1px solid var(--border);
    padding: 14px 18px;
    border-radius: 6px;
    overflow-x: auto;
    margin: 12px 0 18px;
  }
  .lesson-area pre code {
    background: transparent;
    padding: 0;
    color: var(--text);
  }
  .task-box {
    background: var(--bg-2);
    border-left: 4px solid var(--accent);
    padding: 16px 20px;
    margin: 20px 0;
    border-radius: 4px;
  }
  .task-box h3 {
    color: var(--accent);
    margin-bottom: 8px;
    font-size: 16px;
  }
  .task-list { margin-top: 12px; }
  .task-list li {
    padding: 4px 0;
    font-size: 14px;
  }
  .task-list li.pass { color: var(--green); }
  .task-list li.fail { color: var(--red); }
  .editor-area {
    width: 45%;
    min-width: 400px;
    display: flex;
    flex-direction: column;
    background: var(--bg-2);
    border-left: 1px solid var(--border);
  }
  .editor-toolbar {
    padding: 10px 14px;
    background: var(--bg-3);
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .btn {
    background: var(--accent);
    color: var(--bg);
    border: none;
    padding: 8px 16px;
    border-radius: 4px;
    cursor: pointer;
    font-weight: bold;
    font-size: 14px;
    transition: opacity 0.2s;
  }
  .btn:hover { opacity: 0.85; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-secondary {
    background: var(--bg-3);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-green { background: var(--green); }
  .editor-wrap {
    flex: 1;
    position: relative;
    overflow: hidden;
  }
  #codeEditor {
    width: 100%;
    height: 100%;
    background: #1e1e2e;
    color: #e0e0e0;
    border: none;
    padding: 16px;
    font-family: 'Consolas', 'Courier New', monospace;
    font-size: 14px;
    line-height: 1.5;
    resize: none;
    outline: none;
    tab-size: 4;
  }
  .console {
    height: 180px;
    background: #0f0f1e;
    border-top: 1px solid var(--border);
    padding: 12px;
    overflow-y: auto;
    font-family: 'Consolas', monospace;
    font-size: 13px;
  }
  .console-line { margin-bottom: 4px; white-space: pre-wrap; word-break: break-word; }
  .console-line.error { color: var(--red); }
  .console-line.success { color: var(--green); }
  .console-line.info { color: var(--text-dim); }
  .nav-buttons {
    padding: 10px 14px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    background: var(--bg-3);
  }
  .loading-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10, 10, 35, 0.95);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    z-index: 100;
    gap: 16px;
  }
  .spinner {
    width: 50px; height: 50px;
    border: 4px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 200;
  }
  .modal.show { display: flex; }
  .modal-content {
    background: var(--bg-2);
    border: 2px solid var(--accent);
    padding: 40px;
    border-radius: 8px;
    max-width: 500px;
    text-align: center;
  }
  .modal-content h2 { color: var(--accent); margin-bottom: 16px; }
  .certificate {
    background: linear-gradient(135deg, #1b1b32, #2a2a45);
    border: 3px double var(--accent);
    padding: 30px;
    margin: 20px 0;
    border-radius: 8px;
  }
  .certificate h3 { color: var(--accent); margin-bottom: 10px; }
  aside::-webkit-scrollbar, .lesson-area::-webkit-scrollbar, .console::-webkit-scrollbar { width: 8px; }
  aside::-webkit-scrollbar-track, .lesson-area::-webkit-scrollbar-track { background: var(--bg-2); }
  aside::-webkit-scrollbar-thumb, .lesson-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  @media (max-width: 900px) {
    aside { width: 220px; }
    .editor-area { width: 50%; min-width: 300px; }
    .lesson-area { padding: 20px; }
  }
</style>
</head>
<body>

<div id="loading" class="loading-overlay">
  <div class="spinner"></div>
  <div>Загружаем Python-интерпретатор...</div>
  <div style="font-size:12px;color:var(--text-dim)">Pyodide (WebAssembly) — первое открытие может занять 10-20 секунд</div>
</div>

<header>
  <div class="logo">
    <div class="logo-icon">Py</div>
    <div>PyCamp <span style="font-weight:normal;font-size:13px;color:var(--text-dim)">— Полный курс Python</span></div>
  </div>
  <div class="progress-wrap">
    <span id="progressText">0 / 0</span>
    <div class="progress-bar"><div id="progressFill" class="progress-fill" style="width:0%"></div></div>
  </div>
</header>

<main>
  <aside id="sidebar"></aside>
  <div class="content">
    <div class="lesson-area" id="lessonArea"></div>
    <div class="editor-area">
      <div class="editor-toolbar">
        <button class="btn" id="runBtn" onclick="runCode()">▶ Запустить</button>
        <button class="btn btn-green" id="checkBtn" onclick="checkCode()">✓ Проверить</button>
        <button class="btn btn-secondary" onclick="resetCode()">↺ Сбросить</button>
        <button class="btn btn-secondary" onclick="clearConsole()">🗑 Очистить консоль</button>
      </div>
      <div class="editor-wrap">
        <textarea id="codeEditor" spellcheck="false"></textarea>
      </div>
      <div class="console" id="console">
        <div class="console-line info">// Консоль вывода</div>
      </div>
      <div class="nav-buttons">
        <button class="btn btn-secondary" onclick="prevLesson()">← Назад</button>
        <button class="btn btn-secondary" onclick="nextLesson()">Далее →</button>
      </div>
    </div>
  </div>
</main>

<div class="modal" id="certModal">
  <div class="modal-content">
    <h2>🎉 Поздравляем!</h2>
    <p>Вы завершили полный курс Python на PyCamp!</p>
    <div class="certificate">
      <h3>СЕРТИФИКАТ</h3>
      <p>об успешном прохождении курса</p>
      <p style="font-size:22px;color:var(--accent);margin:16px 0;font-weight:bold">«Полный курс Python»</p>
      <p>PyCamp • 2026</p>
    </div>
    <button class="btn" onclick="document.getElementById('certModal').classList.remove('show')">Закрыть</button>
  </div>
</div>

<script>
// ============ ДАННЫЕ КУРСА ============
const lessons = [
  {
    id: 0, section: "Введение",
    title: "Добро пожаловать",
    content: `
      <h1>Добро пожаловать в PyCamp!</h1>
      <p>Это полный интерактивный курс по языку программирования <b>Python</b>. Здесь вы пройдёте путь от самых основ до продвинутых тем.</p>
      <h2>Как учиться</h2>
      <ul>
        <li>Читайте теорию слева</li>
        <li>Пишите код в редакторе справа</li>
        <li>Нажимайте <b>▶ Запустить</b> чтобы выполнить</li>
        <li>Нажимайте <b>✓ Проверить</b> чтобы сдать задание</li>
      </ul>
      <h2>Ваше первое задание</h2>
      <div class="task-box">
        <h3>📝 Задание</h3>
        <p>Выведите на экран фразу <code>Hello, Python!</code></p>
      </div>
    `,
    starter: `# Напишите ваш первый код здесь\nprint("Hello, Python!")`,
    tests: [
      { check: out => out.includes("Hello, Python!"), desc: "Вывод содержит 'Hello, Python!'" }
    ]
  },
  {
    id: 1, section: "Основы",
    title: "Переменные и типы данных",
    content: `
      <h1>Переменные и типы данных</h1>
      <p>Переменная — это именованная ячейка памяти. В Python не нужно указывать тип, он определяется автоматически.</p>
      <pre><code>name = "Алиса"      # str — строка
age = 25            # int — целое число
height = 1.68       # float — дробное число
is_student = True   # bool — логический тип</code></pre>
      <h2>Функция type()</h2>
      <p>Чтобы узнать тип переменной, используйте <code>type()</code>:</p>
      <pre><code>x = 10
print(type(x))  # &lt;class 'int'&gt;</code></pre>
      <div class="task-box">
        <h3>📝 Задание</h3>
        <p>Создайте переменную <code>year</code> со значением <code>2026</code> и выведите её тип через <code>print(type(year))</code>.</p>
      </div>
    `,
    starter: `year = 2026\nprint(type(year))`,
    tests: [
      { check: out => out.includes("<class 'int'>"), desc: "Тип переменной — int" }
    ]
  },
  {
    id: 2, section: "Основы",
    title: "Числа и арифметика",
    content: `
      <h1>Числа и арифметика</h1>
      <p>Python поддерживает все стандартные арифметические операции:</p>
      <pre><code>a = 10
b = 3
print(a + b)   # 13 — сложение
print(a - b)   # 7  — вычитание
print(a * b)   # 30 — умножение
print(a / b)   # 3.333... — деление
print(a // b)  # 3  — целочисленное деление
print(a % b)   # 1  — остаток
print(a ** b)  # 1000 — возведение в степень</code></pre>
      <div class="task-box">
        <h3>📝 Задание</h3>
        <p>Вычислите и выведите остаток от деления <code>17</code> на <code>5</code>.</p>
      </div>
    `,
    starter: `print(17 % 5)`,
    tests: [
      { check: out => out.trim() === "2", desc: "Результат равен 2" }
    ]
  },
  {
    id: 3, section: "Основы",
    title: "Строки",
    content: `
      <h1>Строки</h1>
      <p>Строки создаются в одинарных или двойных кавычках:</p>
      <pre><code>s = "Привет"
s2 = 'Мир'
# Конкатенация
print(s + " " + s2)  # Привет Мир
# Повторение
print("Ha" * 3)      # HaHaHa
# Длина строки
print(len("Python")) # 6</code></pre>
      <h2>Индексация и срезы</h2>
      <pre><code>word = "Python"
print(word[0])     # P
print(word[-1])    # n
print(word[0:3])   # Pyt
print(word[::-1])  # nohtyP (разворот)</code></pre>
      <div class="task-box">
        <h3>📝 Задание</h3>
        <p>Дана строка <code>s = "Hello World"</code>. Выведите её в обратном порядке.</p>
      </div>
    `,
    starter: `s = "Hello World"\nprint(s[::-1])`,
    tests: [
      { check: out => out.trim() === "dlroW olleH", desc: "Строка развёрнута" }
    ]
  },
  {
    id: 4, section: "Основы",
    title: "Форматирование строк",
    content: `
      <h1>Форматирование строк</h1>
      <h2>f-строки (рекомендуется)</h2>
      <pre><code>name = "Иван"
age = 30
print(f"Меня зовут {name}, мне {age} лет")</code></pre>
      <h2>Метод format()</h2>
      <pre><code>print("Меня зовут {}, мне {} лет".format(name, age))</code></pre>
      <h2>%-форматирование (старый стиль)</h2>
      <pre><code>print("Меня зовут %s, мне %d лет" % (name, age))</code></pre>
      <div class="task-box">
        <h3>📝 Задание</h3>
        <p>Используя f-строку, выведите: <code>2 + 2 = 4</code> (числа должны быть вычислены, а не написаны вручную).</p>
      </div>
    `,
    starter: `a = 2\nb = 2\nprint(f"{a} + {b} = {a + b}")`,
    tests: [
      { check: out => out.trim() === "2 + 2 = 4", desc: "Вывод '2 + 2 = 4'" }
    ]
  },
  {
    id: 5, section: "Основы",
    title: "Ввод данных",
    content: `
      <h1>Ввод данных: input()</h1>
      <p>Функция <code>input()</code> читает строку от пользователя. В браузере она эмулируется через предопределённые значения.</p>
      <pre><code>name = input("Как тебя зовут? ")
print(f"Привет, {name}!")</code></pre>
      <p><b>Важно:</b> <code>input()</code> всегда возвращает строку. Чтобы получить число, используйте <code>int()</code> или <code>float()</code>:</p>
      <pre><code>age = int(input("Возраст: "))
print(f"Через 5 лет тебе будет {age + 5}")</code></pre>
      <div class="task-box">
        <h3>📝 Задание</h3>
        <p>Представьте, что пользователь ввёл число <code>7</code>. Умножьте его на <code>2</code> и выведите результат. Используйте <code>input()</code>.</p>
      </div>
    `,
    starter: `# Эмуляция ввода\nimport sys\nsys.stdin = io.StringIO("7")\nimport io\n\nx = int(input())\nprint(x * 2)`,
    tests: [
      { check: out => out.trim() === "14", desc: "Результат равен 14" }
    ]
  },
  {
    id: 6, section: "Условия",
    title: "if / elif / else",
    content: `
      <h1>Условные конструкции</h1>
      <p>Позволяют выполнять разный код в зависимости от условий:</p>
      <pre><code>age = 18
if age < 18:
    print("Несовершеннолетний")
elif age == 18:
    print("Только что совершеннолетний")
else:
    print("Совершеннолетний")</code></pre>
      <h2>Операторы сравнения</h2>
      <pre><code>==  равно
!=  не равно
&gt;   больше
&lt;   меньше
&gt;=  больше или равно
&lt;=  меньше или равно</code></pre>
      <div class="task-box">
        <h3>📝 Задание</h3>
        <p>Дана переменная <code>x = 15</code>. Выведите <code>больше 10</code>, если x &gt; 10, иначе <code>не больше 10</code>.</p>
      </div>
    `,
    starter: `x = 15\nif x > 10:\n    print("больше 10")\nelse:\n    print("не больше 10")`,
    tests: [
      { check: out => out.trim() === "больше 10", desc: "Вывод 'больше 10'" }
    ]
  },
  {
    id: 7, section: "Условия",
    title: "Логические операторы",
    content: `
      <h1>Логические операторы</h1>
      <pre><code>and — И
or  — ИЛИ
not — НЕ</code></pre>
      <pre><code>age = 25
has_id = True
if age >= 18 and has_id:
    print("Доступ разрешён")</code></pre>
      <h2>Проверка на истинность</h2>
      <p>В Python <b>False</b>: <code>0</code>, <code>""</code>, <code>[]</code>, <code>{}</code>, <code>None</code>. Всё остальное — <b>True</b>.</p>
      <div class="task-box">
        <h3>📝 Задание</h3>
        <p>Даны <code>a = 5</code> и <code>b = 10</code>. Выведите <code>OK</code>, если <code>a</code> положительное И <code>b</code> чётное.</p>
      </div>
    `,
    starter: `a = 5\nb = 10\nif a > 0 and b % 2 == 0:\n    print("OK")`,
    tests: [
      { check: out => out.trim() === "OK", desc: "Вывод 'OK'" }
    ]
  },
  {
    id: 8, section: "Циклы",
    title: "Цикл for",
    content: `
      <h1>Цикл for</h1>
      <p>Перебирает элементы последовательности:</p>
      <pre><code>for i in range(5):
    print(i)  # 0, 1, 2, 3, 4

for fruit in ["яблоко", "банан", "вишня"]:
    print(fruit)</code></pre>
      <h2>Функция range()</h2>
      <pre><code>range(5)        # 0, 1, 2, 3, 4
range(2, 6)     # 2, 3, 4, 5
range(0, 10, 2) # 0, 2, 4, 6, 8</code></pre>
      <div class="task-box">
        <h3>📝 Задание</h3>
        <p>Выведите все чётные числа от 2 до 10 включительно, каждое с новой строки.</p>
      </div>
    `,

// ============ СОСТОЯНИЕ ============
let pyodide = null;
let currentLesson = 0;
let completedLessons = new Set(JSON.parse(localStorage.getItem('pycamp_completed') || '[]'));

// ============ ИНИЦИАЛИЗАЦИЯ PYODIDE ============
async function initPyodide() {
  try {
    pyodide = await loadPyodide();
    pyodide.setStdout({ batched: (text) => appendConsole(text) });
    pyodide.setStderr({ batched: (text) => appendConsole(text, 'error') });
    document.getElementById('loading').style.display = 'none';
    renderSidebar();
    loadLesson(0);
    updateProgress();
  } catch (e) {
    document.getElementById('loading').innerHTML =
      `<div style="color:var(--red);text-align:center;padding:20px">
        Ошибка загрузки Python-интерпретатора.<br>
        Проверьте интернет-соединение и обновите страницу.<br>
        <small>${e.message}</small>
       </div>`;
  }
}

// ============ UI ============
function renderSidebar() {
  const sidebar = document.getElementById('sidebar');
  let html = '';
  let currentSection = '';
  lessons.forEach((lesson, idx) => {
    if (lesson.section !== currentSection) {
      currentSection = lesson.section;
      html += `<div class="section-title">${currentSection}</div>`;
    }
    const done = completedLessons.has(idx) ? 'done' : '';
    const active = idx === currentLesson ? 'active' : '';
    html += `<div class="lesson-item ${done} ${active}" onclick="loadLesson(${idx})">
      <span class="check">${completedLessons.has(idx) ? '✓' : ''}</span>
      <span>${idx + 1}. ${lesson.title}</span>
    </div>`;
  });
  sidebar.innerHTML = html;
}

function loadLesson(idx) {
  if (idx < 0 || idx >= lessons.length) return;
  currentLesson = idx;
  const lesson = lessons[idx];
  document.getElementById('lessonArea').innerHTML = lesson.content + renderTasks(lesson);
  document.getElementById('codeEditor').value = lesson.starter;
  clearConsole();
  renderSidebar();
  document.getElementById('lessonArea').scrollTop = 0;
}

function renderTasks(lesson) {
  let html = '<ul class="task-list" id="taskList">';
  lesson.tests.forEach((t, i) => {
    html += `<li id="task-${i}">○ ${t.desc}</li>`;
  });
  html += '</ul>';
  return html;
}

function appendConsole(text, type = '') {
  const cons = document.getElementById('console');
  const line = document.createElement('div');
  line.className = 'console-line ' + type;
  line.textContent = text;
  cons.appendChild(line);
  cons.scrollTop = cons.scrollHeight;
}

function clearConsole() {
  document.getElementById('console').innerHTML = '<div class="console-line info">// Консоль вывода</div>';
}

function updateProgress() {
  const total = lessons.length;
  const done = completedLessons.size;
  document.getElementById('progressText').textContent = `${done} / ${total}`;
  document.getElementById('progressFill').style.width = `${(done/total)*100}%`;
}

// ============ ВЫПОЛНЕНИЕ КОДА ============
async function runCode() {
  if (!pyodide) return;
  const code = document.getElementById('codeEditor').value;
  clearConsole();
  const btn = document.getElementById('runBtn');
  btn.disabled = true;
  btn.textContent = '⏳ Выполняется...';
  try {
    await pyodide.runPythonAsync(code);
  } catch (e) {
    appendConsole(e.message, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = '▶ Запустить';
  }
}

async function checkCode() {
  if (!pyodide) return;
  const code = document.getElementById('codeEditor').value;
  const lesson = lessons[currentLesson];
  clearConsole();
  const btn = document.getElementById('checkBtn');
  btn.disabled = true;
  btn.textContent = '⏳ Проверяем...';

  // Перехватываем вывод
  let output = '';
  pyodide.setStdout({ batched: (text) => { output += text + '\n'; appendConsole(text); } });

  try {
    await pyodide.runPythonAsync(code);
    output = output.trim();
    let allPass = true;
    lesson.tests.forEach((t, i) => {
      const li = document.getElementById(`task-${i}`);
      const pass = t.check(output);
      li.className = pass ? 'pass' : 'fail';
      li.textContent = (pass ? '✓ ' : '✗ ') + t.desc;
      if (!pass) allPass = false;
    });
    if (allPass) {
      appendConsole('✓ Все тесты пройдены!', 'success');
      completedLessons.add(currentLesson);
      localStorage.setItem('pycamp_completed', JSON.stringify([...completedLessons]));
      renderSidebar();
      updateProgress();
      if (completedLessons.size === lessons.length) {
        setTimeout(() => document.getElementById('certModal').classList.add('show'), 800);
      }
    } else {
      appendConsole('✗ Некоторые тесты не пройдены', 'error');
    }
  } catch (e) {
    appendConsole(e.message, 'error');
    lesson.tests.forEach((t, i) => {
      const li = document.getElementById(`task-${i}`);
      li.className = 'fail';
      li.textContent = '✗ ' + t.desc;
    });
  } finally {
    // Восстанавливаем обычный stdout
    pyodide.setStdout({ batched: (text) => appendConsole(text) });
    pyodide.setStderr({ batched: (text) => appendConsole(text, 'error') });
    btn.disabled = false;
    btn.textContent = '✓ Проверить';
  }
}

function resetCode() {
  document.getElementById('codeEditor').value = lessons[currentLesson].starter;
  clearConsole();
}

function prevLesson() { loadLesson(currentLesson - 1); }
function nextLesson() { loadLesson(currentLesson + 1); }

// Поддержка Tab в редакторе
document.addEventListener('DOMContentLoaded', () => {
  const editor = document.getElementById('codeEditor');
  editor.addEventListener('keydown', (e) => {
    if (e.key === 'Tab') {
      e.preventDefault();
      const start = editor.selectionStart;
      const end = editor.selectionEnd;
      editor.value = editor.value.substring(0, start) + '    ' + editor.value.substring(end);
      editor.selectionStart = editor.selectionEnd = start + 4;
    }
  });
});

// Запуск
initPyodide();
</script>
