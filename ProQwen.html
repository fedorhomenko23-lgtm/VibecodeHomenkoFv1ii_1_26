                    index === currentLesson ? 'bg-blue-600' : 'bg-gray-700 hover:bg-gray-600'

            currentLesson = index;

            document.getElementById('lessonContent').innerHTML = `

                <div class="bg-blue-900 border-l-4 border-blue-400 p-4 rounded">

            const code = editor.getValue();

                pyodide.runPython(`

                    sys.stdout = StringIO()

                await pyodide.runPythonAsync(code);
                
                const output = pyodide.runPython('sys.stdout.getvalue()');
                outputConsole.innerHTML = `<pre class="whitespace-pre-wrap">${output || 'Программа выполнена успешно (нет вывода)'}</pre>`;
            } catch (error) {
                outputConsole.innerHTML = `<pre class="text-red-400 whitespace-pre-wrap">Ошибка: ${error.message}</pre>`;
            }
        }

            const outputConsole = document.getElementById('outputConsole');

                pyodide.runPython(`

                    from io import StringIO
                    sys.stdout = StringIO()
